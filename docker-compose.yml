services:
  app:
    build: .
    ports:
      - '8000:8000'
    environment:
      APP_KEY: ${APP_KEY:?Defina APP_KEY (gere com: php artisan key:generate --show)}
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: todo
      DB_USERNAME: todo
      DB_PASSWORD: todo
      SESSION_DRIVER: array
      CACHE_STORE: file
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
