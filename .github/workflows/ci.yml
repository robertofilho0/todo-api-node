name: debug
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: node debug.js
      - run: node debug.js 7.0.24
      - run: node debug.js 8.0.15
      - run: npm ls mongodb
